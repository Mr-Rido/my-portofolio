<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="plannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#plannerBg)"/>

  <!-- App Window -->
  <rect x="50" y="40" width="700" height="420" rx="14" fill="#0c1424" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="50" y="40" width="700" height="42" rx="14" fill="#0f192f"/>
  <circle cx="80" cy="61" r="5" fill="#ef4444"/>
  <circle cx="98" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="116" cy="61" r="5" fill="#10b981"/>
  <rect x="250" y="50" width="280" height="20" rx="5" fill="#1e293b"/>
  <text x="270" y="64" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Student Academic &amp; Task Planner</text>

  <!-- Left Sidebar (Navigation) -->
  <rect x="50" y="82" width="160" height="378" fill="#0a101f"/>
  <rect x="70" y="110" width="120" height="30" rx="6" fill="rgba(139, 92, 246, 0.15)"/>
  <text x="85" y="130" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">📅 Jadwal Kuliah</text>
  <text x="85" y="170" fill="#94a3b8" font-family="sans-serif" font-size="12">📝 Deadline Tugas</text>
  <text x="85" y="205" fill="#94a3b8" font-family="sans-serif" font-size="12">📊 Indeks Prestasi</text>
  <text x="85" y="240" fill="#94a3b8" font-family="sans-serif" font-size="12">📂 Catatan Materi</text>

  <!-- Status Tag (In Development) -->
  <rect x="70" y="400" width="120" height="26" rx="13" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="82" y="417" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">⚡ IN PROGRESS</text>

  <!-- Main Content Cards -->
  <!-- Header greeting -->
  <text x="235" y="125" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Halo, Mahasiswa Sistem Informasi 👋</text>
  <text x="235" y="148" fill="#94a3b8" font-family="sans-serif" font-size="12">Kelola jadwal kuliah semester ini dan pantau tugas mendatang dengan rapi.</text>

  <!-- Schedule Card 1 -->
  <rect x="235" y="175" width="235" height="120" rx="10" fill="#141f38" stroke="rgba(0, 210, 255, 0.2)"/>
  <text x="255" y="205" fill="#00d2ff" font-family="sans-serif" font-size="11" font-weight="bold">HARI INI • 08:00 - 10:30</text>
  <text x="255" y="230" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Pemrograman Web</text>
  <text x="255" y="250" fill="#94a3b8" font-family="sans-serif" font-size="12">Lab Komputer 3 • 3 SKS</text>
  <rect x="255" y="265" width="80" height="18" rx="4" fill="rgba(0, 210, 255, 0.1)"/>
  <text x="265" y="278" fill="#00d2ff" font-family="sans-serif" font-size="10">Next.js &amp; DB</text>

  <!-- Schedule Card 2 -->
  <rect x="490" y="175" width="235" height="120" rx="10" fill="#141f38" stroke="rgba(139, 92, 246, 0.2)"/>
  <text x="510" y="205" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">HARI INI • 13:00 - 15:30</text>
  <text x="510" y="230" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Basis Data Relasional</text>
  <text x="510" y="250" fill="#94a3b8" font-family="sans-serif" font-size="12">Ruang Teori 204 • 3 SKS</text>
  <rect x="510" y="265" width="80" height="18" rx="4" fill="rgba(139, 92, 246, 0.1)"/>
  <text x="520" y="278" fill="#c084fc" font-family="sans-serif" font-size="10">SQL &amp; ERD</text>

  <!-- Task Checklist Card -->
  <rect x="235" y="315" width="490" height="125" rx="10" fill="#121b30" stroke="rgba(255,255,255,0.06)"/>
  <text x="255" y="342" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">📌 Prioritas Tugas Kuliah</text>
  
  <rect x="255" y="358" width="450" height="30" rx="6" fill="#182440"/>
  <circle cx="272" cy="373" r="6" fill="#10b981"/>
  <text x="290" y="377" fill="#ffffff" font-family="sans-serif" font-size="11">Implementasi UI Katalog Web Konveksi (Next.js)</text>
  <text x="650" y="377" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">SELESAI</text>

  <rect x="255" y="396" width="450" height="30" rx="6" fill="#182440"/>
  <circle cx="272" cy="411" r="6" fill="#f59e0b"/>
  <text x="290" y="415" fill="#ffffff" font-family="sans-serif" font-size="11">Normalisasi Basis Data Relasional &amp; Query Lanjutan</text>
  <text x="635" y="415" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">DEADLINE H-2</text>
